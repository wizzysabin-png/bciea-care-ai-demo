<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCIEA Care AI</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#fff7fb;color:#25202a}.wrap{max-width:980px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#8b145c,#e652a0);color:#fff;border-radius:24px;padding:28px}.grid{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid #edd7e4;border-radius:18px;padding:18px;box-shadow:0 8px 30px #6b17440d}.chat{height:430px;overflow:auto;padding:10px;background:#fffafd;border-radius:14px}.msg{margin:10px 0;padding:12px 14px;border-radius:14px;max-width:82%;white-space:pre-wrap}.user{margin-left:auto;background:#8b145c;color:white}.bot{background:#f2e5ed}.row{display:flex;gap:8px;margin-top:10px}input,select,button,textarea{font:inherit;border-radius:12px;border:1px solid #d8bfd0;padding:12px}input,textarea{flex:1}button{background:#8b145c;color:white;border:none;cursor:pointer}button.secondary{background:#fff;color:#8b145c;border:1px solid #8b145c}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#ffe3f2;color:#7e124f;font-size:13px}.notice{font-size:13px;color:#655b63;margin-top:12px}.danger{background:#fff0f0;border:1px solid #ffbdbd;padding:12px;border-radius:12px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.chat{height:390px}}
</style>
</head>
<body><div class="wrap">
<section class="hero"><span class="badge">BCIEA Prototype</span><h1>BCIEA Care AI</h1><p>Breast-health education, patient navigation and human referral support in English and Kinyarwanda.</p></section>
<div class="grid">
<section class="card"><div class="row" style="margin-top:0"><select id="lang"><option value="rw">Kinyarwanda</option><option value="en">English</option></select><button class="secondary" id="newcase">New case</button></div><div id="chat" class="chat"></div><div class="row"><input id="message" placeholder="Andika ubutumwa... / Type a message..."><button id="voice" class="secondary">🎤</button><button id="send">Send</button></div><div class="notice">This prototype cannot diagnose or rule out cancer. Urgent symptoms should be assessed in person.</div></section>
<aside class="card"><h3>Optional patient case</h3><input id="name" placeholder="Name (optional)"><input id="phone" placeholder="Phone (optional)" style="margin-top:8px"><label style="display:block;margin:10px 0"><input type="checkbox" id="consent"> I consent to create a case record for navigation.</label><button id="createPatient">Create case</button><p id="patientId" class="notice"></p><hr><h3>Referral request</h3><textarea id="reason" placeholder="Reason for referral"></textarea><button id="createReferral" style="margin-top:8px">Create referral</button><p id="refStatus" class="notice"></p><hr><a href="/admin">Open staff/admin dashboard →</a></aside>
</div></div>
<script>
let conversationId=null, patientPublicId=null;
const chat=document.getElementById('chat');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
add('Muraho! Ndi BCIEA Care AI. Nshobora kugufasha ku makuru y’ubuzima bw’amabere, ibimenyetso, no koherezwa kwa muganga. / Hello! I can help with breast-health information, symptoms and referral navigation.','bot');
async function send(){const input=document.getElementById('message');const text=input.value.trim();if(!text)return;add(text,'user');input.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,language:document.getElementById('lang').value,conversation_id:conversationId,patient_public_id:patientPublicId})});const j=await r.json();conversationId=j.conversation_id;add(j.response,'bot');}
document.getElementById('send').onclick=send;document.getElementById('message').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.getElementById('newcase').onclick=()=>{conversationId=null;add('New conversation started.','bot')};
document.getElementById('createPatient').onclick=async()=>{const consent=document.getElementById('consent').checked;if(!consent){document.getElementById('patientId').textContent='Consent is required before creating a stored patient case.';return}const r=await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('name').value||null,phone:document.getElementById('phone').value||null,preferred_language:document.getElementById('lang').value,consent_given:consent})});const j=await r.json();patientPublicId=j.public_id;document.getElementById('patientId').textContent='Case ID: '+patientPublicId};
document.getElementById('createReferral').onclick=async()=>{if(!patientPublicId){document.getElementById('refStatus').textContent='Create a consented patient case first.';return}const reason=document.getElementById('reason').value.trim();if(!reason){document.getElementById('refStatus').textContent='Add a referral reason.';return}const r=await fetch('/api/referrals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_public_id:patientPublicId,reason,priority:'needs_assessment'})});const j=await r.json();document.getElementById('refStatus').textContent='Referral #'+j.id+' created. Status: '+j.status};
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){const rec=new SpeechRecognition();rec.interimResults=false;document.getElementById('voice').onclick=()=>{rec.lang=document.getElementById('lang').value==='rw'?'rw-RW':'en-US';rec.start()};rec.onresult=e=>{document.getElementById('message').value=e.results[0][0].transcript};rec.onerror=()=>add('Voice recognition is not available for this browser/language. You can type instead.','bot')}else{document.getElementById('voice').disabled=true;}
</script></body></html>

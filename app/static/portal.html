<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Portal — BCIEA Care AI</title><link rel="stylesheet" href="/static/ui.css">
<style>.app{display:grid;grid-template-columns:1fr 360px;gap:20px;padding:22px 0;min-height:calc(100vh - 66px)}.chatp{display:flex;flex-direction:column;padding:18px;height:calc(100vh - 110px)}
#chat{flex:1;overflow:auto;padding:6px}.m{margin:10px 0;padding:12px 16px;border-radius:18px;max-width:84%;white-space:pre-wrap;line-height:1.5;animation:up .4s both}.u{margin-left:auto;background:linear-gradient(135deg,var(--pk),var(--mg))}.b{background:#ffffff12;border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1}.qs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.qs .chip{cursor:pointer}.qs .chip:hover{background:#ff4fa344}
aside{display:flex;flex-direction:column;gap:16px;overflow:auto;max-height:calc(100vh - 110px)}aside .glass{padding:18px}h4{margin:0 0 10px}
.gauge{width:170px;height:170px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--c,#555) calc(var(--s,0)*1%),#ffffff14 0);box-shadow:0 0 40px color-mix(in srgb,var(--c,#555) 35%,transparent);transition:.8s;transform:rotateX(12deg)}
.gauge div{width:134px;height:134px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;text-align:center;font-size:40px;font-weight:800;line-height:1}.gauge small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:4px}
ol{padding-left:18px;margin:8px 0 0;line-height:1.6;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:6px}.lab{display:flex;gap:8px;margin:8px 0;align-items:center;font-size:14px}.lab input{width:auto}.sm{font-size:13px;margin:8px 0 0}
@media(max-width:900px){.app{grid-template-columns:1fr}.chatp{height:70vh}aside{max-height:none}}</style></head><body>
<nav><div class="wrap"><a class="logo" href="/"><i></i>BCIEA Care AI</a><span class="sp"></span><a class="l" href="/">← Website</a><select id="lang" style="width:auto"><option value="rw">Kinyarwanda</option><option value="en">English</option></select></div></nav>
<div class="wrap app"><section class="glass chatp"><div id="chat"></div><div class="qs" id="qs"></div>
<div class="row"><input id="message" placeholder="Andika ubutumwa... / Type a message..."><button class="btn" id="voice" title="Voice">🎤</button><button class="btn pri" id="send">Send</button></div>
<p class="muted sm">Cannot diagnose or rule out cancer. Urgent symptoms need in-person care.</p></section>
<aside><div class="glass tilt" id="tri"><h4>Live urgency check</h4><div class="gauge" id="gauge"><div><span><span id="sc">0</span><small id="lv">waiting…</small></span></div></div><p class="sm" style="text-align:center">See a professional: <b id="tf">—</b></p><div class="chips" id="sig"></div></div>
<div class="glass hidden" id="planb"><h4>Your next steps</h4><ol id="plan"></ol><button class="btn pri hidden" id="nav" style="margin-top:14px;width:100%;justify-content:center">Request a human navigator</button><p id="refStatus" class="muted sm"></p></div>
<div class="glass"><h4>Optional private case</h4><input id="name" placeholder="Name (optional)"><input id="phone" placeholder="Phone (optional)" style="margin-top:8px"><label class="lab"><input type="checkbox" id="consent"> I consent to a case record for navigation.</label><button class="btn" id="mk" style="width:100%;justify-content:center">Create case</button><p id="pid" class="muted sm"></p></div></aside></div>
<script src="/static/ui.js"></script><script>
const $=i=>document.getElementById(i);let cid=null,pid=null,last=null;
const add=(t,w)=>{const d=document.createElement('div');d.className='m '+w;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d};
const Q=[['I found a lump in my breast','Nabonye akabyimba mu ibere'],['What is breast awareness?','Kwimenya amabere ni iki?'],['I am afraid and the clinic is far','Mfite ubwoba kandi ivuriro riri kure']];
const setQ=()=>{$('qs').innerHTML=Q.map(q=>`<span class="chip">${q[$('lang').value=='rw'?1:0]}</span>`).join('');[...$('qs').children].forEach(c=>c.onclick=()=>{$('message').value=c.textContent;send()})};
$('lang').onchange=setQ;setQ();
add('Muraho! Ndi BCIEA Care AI. Nshobora kugufasha ku makuru y’ubuzima bw’amabere, ibimenyetso, no koherezwa kwa muganga.\nHello! I can help with breast-health information, symptoms and referral navigation.','b');
async function send(){const t=$('message').value.trim();if(!t)return;add(t,'u');$('message').value='';const w=add('…','b');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,language:$('lang').value,conversation_id:cid,patient_public_id:pid})});const j=await r.json();cid=j.conversation_id;last=j;w.textContent=j.response;show(j)}catch(e){w.textContent='Connection problem. Please try again.'}}
function show(j){const g=$('gauge');g.className='gauge L-'+j.triage_level;g.style.setProperty('--s',j.risk_score);$('sc').textContent=j.risk_score;$('lv').textContent=j.triage_level.replace('_',' ');$('tf').textContent=j.timeframe;
 $('sig').innerHTML=[...j.signals,...j.barriers.map(b=>'Barrier: '+b)].map(s=>`<span class="chip">${s}</span>`).join('');
 $('planb').classList.remove('hidden');$('plan').innerHTML=j.plan.map(p=>`<li>${p}</li>`).join('');$('nav').classList.toggle('hidden',!j.human_handoff_recommended||j.triage_level=='emergency')}
$('send').onclick=send;$('message').onkeydown=e=>{if(e.key=='Enter')send()};
$('mk').onclick=async()=>{if(!$('consent').checked){$('pid').textContent='Consent is required to store a case.';return}
 const r=await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('name').value||null,phone:$('phone').value||null,preferred_language:$('lang').value,consent_given:true})});pid=(await r.json()).public_id;$('pid').textContent='Case ID: '+pid};
$('nav').onclick=async()=>{if(!pid){$('refStatus').textContent='Create a private case first (below), then press again.';return}
 const r=await fetch('/api/referrals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_public_id:pid,reason:'AI triage: '+last.signals.join(', ')+(last.barriers.length?' | barriers: '+last.barriers.join(', '):''),priority:last.triage_level,risk_score:last.risk_score})});const j=await r.json();$('refStatus').textContent='Request #'+j.id+' sent. A navigator will follow up.'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();$('voice').onclick=()=>{rec.lang=$('lang').value=='rw'?'rw-RW':'en-US';rec.start()};rec.onresult=e=>{$('message').value=e.results[0][0].transcript;send()};rec.onerror=()=>add('Voice is unavailable here. Please type instead.','b')}else $('voice').disabled=true;
</script></body></html>

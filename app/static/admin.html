<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Command Centre — BCIEA Care AI</title><link rel="stylesheet" href="/static/ui.css">
<style>.lg{min-height:100vh;display:grid;place-items:center}.lg .glass{padding:36px;width:min(420px,92vw);text-align:center}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}.kp .glass{padding:18px}.n{font-size:38px;font-weight:800;letter-spacing:-.03em}.n.bad{color:var(--er)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.glass.p{padding:20px;margin-bottom:14px}.bar{display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:14px}.bar i{display:block;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--c,var(--pk)),#fff3);box-shadow:0 0 12px var(--c,var(--pk));transition:width 1s}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}td select,td input{padding:7px 9px;border-radius:10px;font-size:13px}.sc{font-weight:800;color:var(--c)}.late{color:var(--er);font-weight:700}.aud{max-height:230px;overflow:auto;font-size:13px}.aud div{padding:6px 0;border-bottom:1px solid var(--bd)}
@media(max-width:800px){.two{grid-template-columns:1fr}}</style></head><body>
<div class="lg" id="gate"><div class="glass tilt"><div class="logo" style="justify-content:center;font-size:22px"><i></i>Staff Command Centre</div><p class="muted">Authorised BCIEA staff only.</p><input id="key" type="password" placeholder="Admin key"><button class="btn pri" style="margin-top:14px;width:100%;justify-content:center" onclick="go()">Enter</button><p class="muted" style="font-size:13px"><a href="/">← Back to website</a></p></div></div>
<div id="app" class="hidden"><nav><div class="wrap"><a class="logo" href="/"><i></i>Command Centre</a><span class="sp"></span><span class="muted" id="ts"></span><a class="btn" href="/portal">AI Portal</a></div></nav>
<div class="wrap"><div class="kp" id="kp"></div><div class="two"><div class="glass p"><h3 style="margin-top:0">Triage mix</h3><div id="tr"></div></div><div class="glass p"><h3 style="margin-top:0">Barriers to care</h3><div id="ba"></div></div></div>
<div class="glass p"><h3 style="margin-top:0">Priority queue <span class="muted" style="font-size:13px;font-weight:400">sorted by urgency → risk score → age · SLA countdown</span></h3><div style="overflow:auto"><table><thead><tr><th>#</th><th>Patient</th><th>Level</th><th>Risk</th><th>SLA</th><th>Reason</th><th>Status</th><th>Notes</th></tr></thead><tbody id="rf"></tbody></table></div></div>
<div class="glass p"><h3 style="margin-top:0">Audit log</h3><div class="aud" id="au"></div></div></div></div>
<script src="/static/ui.js"></script><script>
const $=i=>document.getElementById(i),H=()=>({'X-Admin-Key':$('key').value,'Content-Type':'application/json'});
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const C={education:'#5ee6a8',needs_assessment:'#ffc857',urgent:'#ff8a4c',emergency:'#ff5d6c'};
async function go(){const r=await fetch('/api/admin/stats',{headers:H()});if(!r.ok){alert('Invalid admin key');return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');load();setInterval(load,30000)}
const bars=(o,col)=>{const m=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="bar"><span>${k.replace('_',' ')}</span><i style="width:${v/m*100}%;--c:${col?col[k]:''}"></i><b>${v}</b></div>`).join('')||'<p class="muted">No data yet</p>'};
async function load(){const s=await(await fetch('/api/admin/stats',{headers:H()})).json();
 const k=[['Patients',s.patients],['Conversations',s.conversations],['Pending referrals',s.pending_referrals],['Overdue (SLA)',s.overdue,s.overdue?'bad':''],['Avg risk score',s.avg_risk]];
 $('kp').innerHTML=k.map(x=>`<div class="glass tilt"><div class="muted">${x[0]}</div><div class="n ${x[2]||''}">${x[1]}</div></div>`).join('');$('tr').innerHTML=bars(s.triage,C);$('ba').innerHTML=bars(s.barriers);
 const rows=await(await fetch('/api/admin/referrals',{headers:H()})).json();
 $('rf').innerHTML=rows.map(x=>{const h=x.hours_left,sla=h===null?'—':h<0?`<span class="late">${Math.abs(h)}h overdue</span>`:h+'h left';
  return `<tr><td>${x.id}</td><td>${x.patient_public_id}</td><td><span class="pill" style="--c:${C[x.priority]}">${x.priority.replace('_',' ')}</span></td><td class="sc" style="--c:${C[x.priority]}">${x.risk_score}</td><td>${sla}</td><td>${esc(x.reason)}</td><td><select id="s${x.id}">${['pending','contacted','scheduled','completed','closed'].map(o=>`<option ${o==x.status?'selected':''}>${o}</option>`).join('')}</select></td><td><input id="n${x.id}" value="${esc(x.navigator_notes)}" placeholder="note"><button class="btn" style="padding:6px 12px;margin-top:6px" onclick="upd(${x.id})">Save</button></td></tr>`}).join('')||'<tr><td colspan=8 class="muted">No referrals yet</td></tr>';
 const a=await(await fetch('/api/admin/audit',{headers:H()})).json();$('au').innerHTML=a.map(x=>`<div><b>${esc(x.action)}</b> · ${esc(x.entity_type||'')} ${esc(x.entity_id||'')} <span class="muted">${x.created_at.slice(0,16).replace('T',' ')}</span></div>`).join('');$('ts').textContent='Updated '+new Date().toLocaleTimeString()}
async function upd(id){await fetch('/api/admin/referrals/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:$('s'+id).value,navigator_notes:$('n'+id).value})});load()}
$('key').onkeydown=e=>{if(e.key=='Enter')go()};
</script></body></html>

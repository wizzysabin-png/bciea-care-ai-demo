<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIEA Care AI Admin</title><style>body{font-family:system-ui;margin:0;background:#f7f3f6;color:#27202a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{background:#5e0d40;color:#fff;padding:22px;border-radius:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;padding:16px;border-radius:16px;border:1px solid #e5d4df}.n{font-size:30px;font-weight:700}.row{display:flex;gap:8px;align-items:center}input,button,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #ceb9c7}button{background:#7d1453;color:#fff;border:none}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f0e3eb}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}table{font-size:13px}}</style></head><body><div class="wrap"><div class="top"><h1>BCIEA Care AI — Staff Dashboard</h1><div class="row"><input id="key" type="password" placeholder="Admin key"><button onclick="loadAll()">Load dashboard</button></div></div><div id="cards" class="cards"></div><div class="card"><h2>Referrals</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Patient</th><th>Priority</th><th>Reason</th><th>Status</th><th>Update</th></tr></thead><tbody id="refs"></tbody></table></div></div></div><script>
function headers(){return {'X-Admin-Key':document.getElementById('key').value,'Content-Type':'application/json'}}
async function loadAll(){let r=await fetch('/api/admin/stats',{headers:headers()});if(!r.ok){alert('Invalid admin key');return}let s=await r.json();document.getElementById('cards').innerHTML=`<div class=card><div>Patients</div><div class=n>${s.patients}</div></div><div class=card><div>Conversations</div><div class=n>${s.conversations}</div></div><div class=card><div>Referrals</div><div class=n>${s.referrals}</div></div><div class=card><div>Pending</div><div class=n>${s.pending_referrals}</div></div>`;r=await fetch('/api/admin/referrals',{headers:headers()});let rows=await r.json();document.getElementById('refs').innerHTML=rows.map(x=>`<tr><td>${x.id}</td><td>${x.patient_public_id}</td><td>${x.priority}</td><td>${escapeHtml(x.reason)}</td><td>${x.status}</td><td><select id=s${x.id}><option>pending</option><option>contacted</option><option>scheduled</option><option>completed</option><option>closed</option></select><button onclick="upd(${x.id})">Save</button></td></tr>`).join('')}
async function upd(id){let status=document.getElementById('s'+id).value;await fetch('/api/admin/referrals/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({status})});loadAll()}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
